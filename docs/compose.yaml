services:
  mail:
    image: ghcr.io/matthiasbalke/mail-service:latest
    env_file:
      - ../local/.env
    restart: "unless-stopped"
    volumes:
    - type: bind
      source: "${CERT_PATH:?Set CERT_PATH}/ca.crt"
      target: /tmp/ca.crt
      read_only: true
      bind:
        create_host_path: false
    stop_grace_period: 15s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  smtp:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - "127.0.0.1:${SMTP_HOST_PORT:-1025}:1025"
      - "0.0.0.0:${MAILPIT_HOST_PORT:-8025}:8025"
    command:
      - --smtp
      - 0.0.0.0:1025
      - --listen
      - 0.0.0.0:8025
      - --smtp-tls-cert
      - /certs/wildcard.crt
      - --smtp-tls-key
      - /certs/wildcard.key
      - --smtp-require-starttls
    environment:
#      MP_UI_AUTH: "${SMTP_USER:?Set SMTP_USER}:${SMTP_PASSWORD:?Set SMTP_PASSWORD}"
      MP_SMTP_AUTH: "${SMTP_USER:?Set SMTP_USER}:${SMTP_PASSWORD:?Set SMTP_PASSWORD}"
    env_file:
      - ../local/.env
    networks:
      default:
        aliases:
          - "${SMTP_HOST:?Set SMTP_HOST}"
    volumes:
      - type: bind
        source: "${CERT_PATH:?Set CERT_PATH}"
        target: /certs
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
