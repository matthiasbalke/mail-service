name: Build and publish
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run test:integration
      - name: Validate Compose example
        run: |
          mkdir -p local
          cp docs/.env.example local/.env
          trap 'rm -f local/.env' EXIT
          docker compose --env-file local/.env -f docs/compose.yaml config --quiet
      - name: Test image promotion policy
        run: python3 .github/actions/promote-image/tests/test_promote.py
      - name: Verify manifest promotion and publication with a local registry
        run: |
          python3 .github/actions/promote-image/tests/test_registry.py
          python3 tests/ci/test_publication.py
      - name: Validate workflow contracts
        run: bun test tests/ci/workflows.test.ts
  native:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Determine candidate image name
        id: image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "candidate=ghcr.io/${GITHUB_REPOSITORY,,}:candidate-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCHITECTURE" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'push' && steps.image.outputs.candidate || 'mail-service:local' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: ${{ github.event_name == 'push' && 'mode=min' || 'false' }}
          cache-from: type=gha,scope=image-${{ matrix.architecture }}
          cache-to: type=gha,scope=image-${{ matrix.architecture }},mode=max
      - name: Smoke-test exact native image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          reference=mail-service:local
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            reference="$IMAGE@$DIGEST"
            docker pull "$reference"
          fi
          bun scripts/docker-smoke.ts "$reference"
  publish:
    needs: [validate, native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: verified-main-images-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified native index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKS_RESULT: ${{ needs.validate.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}" bash scripts/publish-images.sh
