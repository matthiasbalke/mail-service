name: Promote release image
on:
  push:
    # This is a glob; resolve-release.sh validates canonical SemVer before login.
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: promote-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # Load trusted automation rather than scripts from the tagged commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Validate version and resolve release commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/resolve-release.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Promote verified digest without rebuilding
        uses: ./.github/actions/promote-image
        with:
          image: ${{ steps.image.outputs.name }}
          source-sha: ${{ steps.release.outputs.sha }}
          destination-tag: ${{ github.ref_name }}
